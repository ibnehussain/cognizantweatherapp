<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Weather Dashboard — Search current weather by city name" />
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Weather icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </head>

  <body>

    <!-- ─── Header ─────────────────────────────────────────── -->
    <header class="site-header">
      <div class="header-inner">
        <div class="logo">
          <i class="fa-solid fa-cloud-sun" aria-hidden="true"></i>
          <span>WeatherDash</span>
        </div>

        <!-- Unit toggle -->
        <div class="unit-toggle" role="group" aria-label="Temperature unit">
          <button id="btn-celsius"  class="unit-btn active" aria-pressed="true">°C</button>
          <button id="btn-fahrenheit" class="unit-btn" aria-pressed="false">°F</button>
        </div>
      </div>
    </header>

    <!-- ─── Main content ────────────────────────────────────── -->
    <main class="main-content">

      <!-- Search section -->
      <section class="search-section" aria-label="City search">
        <form id="search-form" class="search-form" novalidate>
          <label for="city-input" class="visually-hidden">Enter city name</label>
          <div class="search-input-wrapper">
            <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
            <input
              type="text"
              id="city-input"
              class="search-input"
              placeholder="Search city… e.g. London"
              autocomplete="off"
              aria-required="true"
              aria-describedby="input-error"
            />
            <button type="submit" class="search-btn" aria-label="Search weather">
              Search
            </button>
          </div>
          <!-- Inline validation error -->
          <p id="input-error" class="input-error" role="alert" aria-live="polite" hidden></p>
        </form>
      </section>

      <!-- ─── Loading indicator ────────────────────────────── -->
      <div id="loader" class="loader" aria-live="polite" aria-label="Loading weather data" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p>Fetching weather data…</p>
      </div>

      <!-- ─── API / network error banner ──────────────────── -->
      <div id="error-banner" class="error-banner" role="alert" aria-live="assertive" hidden>
        <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        <span id="error-message"></span>
      </div>

      <!-- ─── Weather card ─────────────────────────────────── -->
      <section id="weather-card" class="weather-card" aria-label="Current weather" hidden>

        <!-- Card header: city + date -->
        <div class="card-header">
          <div class="city-info">
            <h1 id="city-name" class="city-name"></h1>
            <p id="city-country" class="city-country"></p>
          </div>
          <p id="weather-date" class="weather-date"></p>
        </div>

        <!-- Main weather display -->
        <div class="card-body">
          <!-- Left: icon + condition -->
          <div class="weather-icon-wrap">
            <img id="weather-icon" src="" alt="" class="weather-icon" />
            <p id="weather-condition" class="weather-condition"></p>
          </div>

          <!-- Right: temperature -->
          <div class="temperature-wrap">
            <span id="temperature" class="temperature"></span>
            <span id="unit-label" class="unit-label">°C</span>
          </div>
        </div>

        <!-- Stats row: humidity, wind, feels-like -->
        <div class="card-stats">
          <div class="stat-item">
            <i class="fa-solid fa-droplet" aria-hidden="true"></i>
            <span class="stat-label">Humidity</span>
            <span id="humidity" class="stat-value"></span>
          </div>
          <div class="stat-item">
            <i class="fa-solid fa-wind" aria-hidden="true"></i>
            <span class="stat-label">Wind</span>
            <span id="wind-speed" class="stat-value"></span>
          </div>
          <div class="stat-item">
            <i class="fa-solid fa-temperature-half" aria-hidden="true"></i>
            <span class="stat-label">Feels Like</span>
            <span id="feels-like" class="stat-value"></span>
          </div>
        </div>

      </section>

      <!-- ─── Search history ───────────────────────────────── -->
      <section id="history-section" class="history-section" aria-label="Recent searches" hidden>
        <div class="history-header">
          <h2 class="history-title">Recent Searches</h2>
          <button id="clear-history-btn" class="clear-btn" aria-label="Clear search history">
            Clear
          </button>
        </div>
        <ul id="history-list" class="history-list" role="list"></ul>
      </section>

    </main>

    <!-- ─── Footer ──────────────────────────────────────────── -->
    <footer class="site-footer">
      <p>Data provided by <a href="https://openweathermap.org" target="_blank" rel="noopener noreferrer">OpenWeatherMap</a></p>
    </footer>

    <script src="js/app.js"></script>
  </body>
</html>
